name: Checked Idris Holomorphic GLES APK

on:
  pull_request:
    paths:
      - 'gpu/**'
      - 'android/**'
      - '_/shader/**'
      - '.github/workflows/generated-holomorphic-apk.yml'
      - '.github/workflows/ick-compilers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checked-holomorphic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  generated-apk:
    needs: compilers
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact Holomorphic head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out checked Idris shader compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: fuego-ironworks/idris-shader-backend
          ref: f32f27a37a176a7b2c580aa703c5d33df9511728
          path: _/shader/backend
          persist-credentials: false

      - name: Install Idris compiler and shader validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes chezscheme glslang-tools libgmp-dev

      - name: Cache Idris2 with matching compiler API
        id: idris-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.idris2
          key: holomorphic-idris2-0.8.0-chezscheme-api-v1

      - name: Bootstrap checked Idris2 compiler and API
        if: steps.idris-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme
          make -C /tmp/Idris2 install
          export PATH="$HOME/.idris2/bin:$PATH"
          make -C /tmp/Idris2 clean
          make -C /tmp/Idris2 all
          make -C /tmp/Idris2 install
          make -C /tmp/Idris2 install-api

      - name: Make compiler available
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Generate the actual Android fragment
        run: |
          set -euo pipefail
          backend="_/shader/backend"
          mkdir -p "$backend/src/Example" "_/shader/generated"
          cp gpu/Example/HolomorphicLive.idr "$backend/src/Example/HolomorphicLive.idr"
          idris2 --version
          make -C "$backend" backend
          "$backend/build/exec/idris2-glsles" --cg glsles \
            --source-dir "$backend/src" --output-dir "_/shader/generated" \
            "$backend/src/Example/HolomorphicLive.idr" -o continuation
          test -s "_/shader/generated/continuation.frag"
          glslangValidator -S frag "_/shader/generated/continuation.frag"
          grep -Fq 'uniform vec2 u_holomorphic_coefficients[5];' "_/shader/generated/continuation.frag"
          grep -Fq 'uniform float u_remote_pole_time;' "_/shader/generated/continuation.frag"
          grep -Fq 'uniform vec2 u_zero_positions[64];' "_/shader/generated/continuation.frag"
          grep -Fq 'uniform vec2 u_pole_positions[64];' "_/shader/generated/continuation.frag"
          printf 'compiler=idris2-glsles\nbackend_repo=fuego-ironworks/idris-shader-backend\nbackend_commit=f32f27a37a176a7b2c580aa703c5d33df9511728\napplication_repo=isomorphismes/holomorphic\napplication_commit=%s\nfragment_sha256=%s\n' \
            "${{ github.event.pull_request.head.sha || github.sha }}" \
            "$(sha256sum _/shader/generated/continuation.frag | cut -d ' ' -f 1)" \
            > "_/shader/generated/continuation.provenance"

      - name: Qualify native ICK compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@ba3ff90023b09e525313793554edecf2141ff95b

      - name: Check out pinned ICK stage interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: _/ai-ci-ick
          persist-credentials: false

      - name: Download qualified native stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ick-*
          path: _/build/ick-packages
          merge-multiple: true

      - name: Restore qualified native stages
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86_64; do
            make -f _/ai-ci-ick/ick-android/Makefile restore-stage \
              ABI="$abi" ICK_STAGE="$GITHUB_WORKSPACE/_/build/ick/$abi" \
              ICK_ARCHIVE="$GITHUB_WORKSPACE/_/build/ick-packages/ick-$abi.tar.gz"
          done

      - name: Install Android packaging toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''

      - name: Install Android NDK and platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build signed APK selecting generated shader only
        working-directory: android
        env:
          HOLOMORPHIC_GENERATED_FRAGMENT: ${{ github.workspace }}/_/shader/generated/continuation.frag
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Compare generated shader to packaged runtime asset
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -p "$apk" assets/continuation.frag > "_/shader/packaged.frag"
          unzip -p "$apk" assets/continuation.provenance > "_/shader/packaged.provenance"
          cmp "_/shader/generated/continuation.frag" "_/shader/packaged.frag"
          cmp "_/shader/generated/continuation.provenance" "_/shader/packaged.provenance"
          sha256sum "$apk" "_/shader/packaged.frag" > "_/shader/generated/artifact-digests.sha256"
          ! grep -Fq '/*__WEGERT_COLOR_CORE__*/' "_/shader/packaged.frag"

      - name: Check native producer/toolchain contract
        uses: isomorphisms/ai-ci@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        with:
          suite: _/ci/build-toolchain-suite.tsv
          root: .

      - name: Verify stable APK signer
        uses: isomorphisms/ai-ci/android-signing@b3af13b3ab2bac9dd7c72bf9dd855ed5a17609b5
        with:
          apk: android/app/build/outputs/apk/debug/app-debug.apk
          lane: test

      - name: Upload APK and compiler provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-idris-holomorphic-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            _/shader/generated/continuation.frag
            _/shader/generated/continuation.provenance
            _/shader/generated/artifact-digests.sha256
          if-no-files-found: error

  emulate:
    needs: generated-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download exact generated APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-idris-holomorphic-apk
          path: artifacts

      - name: Prepare Android emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''

      - name: Enable KVM device permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise emitted fragment in the actual Holomorphic app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            set -euo pipefail
            apk="artifacts/android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$apk"
            adb install -r "$apk"
            adb install -r "$apk"
            adb logcat -c
            adb shell am start -S -W -n org.isomorphisms.analyticcontinuation.lasso.dev/org.isomorphisms.analyticcontinuation.ExplorerActivity
            timeout 35 bash -c 'until adb logcat -d | grep -Fq "holomorphic field GLSL backend selected: compiler=idris2-glsles"; do sleep 1; done'
            sleep 3
            adb logcat -d > generated-holomorphic-emulator.log
            grep -Fq 'holomorphic field renderer ready:' generated-holomorphic-emulator.log
            grep -Fq 'holomorphic field GLSL backend selected: compiler=idris2-glsles' generated-holomorphic-emulator.log
            grep -Fq 'holomorphic field ready:' generated-holomorphic-emulator.log
            ! grep -Eiq 'shader compilation failed|program link failed|shader uniforms unavailable|FATAL EXCEPTION' generated-holomorphic-emulator.log
            adb shell pidof -s org.isomorphisms.analyticcontinuation.lasso.dev | tr -d '\r' | grep -Eq '^[0-9]+$'
            adb exec-out screencap -p > generated-holomorphic-frame-a.png
            sleep 2
            adb exec-out screencap -p > generated-holomorphic-frame-b.png
            test -s generated-holomorphic-frame-a.png
            test -s generated-holomorphic-frame-b.png

      - name: Upload actual app runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-idris-holomorphic-emulator
          path: |
            generated-holomorphic-emulator.log
            generated-holomorphic-frame-a.png
            generated-holomorphic-frame-b.png
          if-no-files-found: warn
