name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out Wegert coloring oracle
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: main
          path: .wegert-upstream
          persist-credentials: false
      - name: Reject cross-repository coloring drift
        run: >-
          cmp
          android/app/src/main/assets/wegert_color.glsl
          .wegert-upstream/code/wegert_color.glsl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Smoke-test three holomorphic direction workers
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tests/test_holomorphic_walk.c \
            android/app/src/main/cpp/holomorphic_walk.c \
            -pthread -lm \
            -o /tmp/test-holomorphic-walk
          /tmp/test-holomorphic-walk
      - name: Kill polynomial mutants that pass the historical worker smoke
        env:
          HOLOMORPHIC_SEMANTIC_RECEIPT_DIR: ${{ runner.temp }}/holomorphic-semantic-t1
        run: sh tests/semantic_mutations.sh
      - name: Preserve numerical mutant/positive-control receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: holomorphic-semantic-t1-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/holomorphic-semantic-t1/holomorphic-semantic-mutants.tsv
          if-no-files-found: warn
      - name: Reject migrated Lacunary machinery in the live app
        run: |
          test ! -e android/app/src/main/cpp/analytic_continuation.c
          ! grep -RniE 'lasso_map|inverse_lasso|dragging_lasso|lasso_coefficients|continuation_path' android/app/src/main/cpp android/app/src/main/assets/continuation.frag.in
