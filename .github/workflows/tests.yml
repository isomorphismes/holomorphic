name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Qualify the native ICK compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@ba3ff90023b09e525313793554edecf2141ff95b

      - name: Check out Wegert coloring oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: main
          path: .wegert-upstream
          persist-credentials: false
      - name: Reject cross-repository coloring drift
        run: >-
          cmp
          android/app/src/main/assets/wegert_color.glsl
          .wegert-upstream/code/wegert_color.glsl
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Smoke-test three holomorphic direction workers
        run: |
          make -f _/ick/Makefile test ICK="${{ steps.ick.outputs.compiler }}"
      - name: Reject migrated Lacunary machinery in the live app
        run: |
          test ! -e android/app/src/main/cpp/analytic_continuation.c
          ! grep -RniE 'lasso_map|inverse_lasso|dragging_lasso|lasso_coefficients|continuation_path' android/app/src/main/cpp android/app/src/main/assets/continuation.frag.in
