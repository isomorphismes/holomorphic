name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Wegert coloring oracle
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: main
          path: .wegert-upstream
          persist-credentials: false
      - name: Reject cross-repository coloring drift
        run: >-
          cmp
          android/app/src/main/assets/wegert_color.glsl
          .wegert-upstream/code/wegert_color.glsl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic meromorphic-divisor oracle
        run: python -m unittest discover -s _/oracle -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -v
      - name: Smoke-test three holomorphic direction workers
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tests/test_holomorphic_walk.c \
            android/app/src/main/cpp/holomorphic_walk.c \
            -pthread -lm \
            -o /tmp/test-holomorphic-walk
          /tmp/test-holomorphic-walk
      - name: Reject migrated Lacunary machinery in the live app
        run: |
          test ! -e android/app/src/main/cpp/analytic_continuation.c
          ! grep -RniE 'lasso_map|inverse_lasso|dragging_lasso|lasso_coefficients|continuation_path' android/app/src/main/cpp android/app/src/main/assets/continuation.frag.in
