name: F-Droid release build

on:
  pull_request:
    paths:
      - '_/**'
      - '.github/workflows/ick-compilers.yml'
      - '.github/workflows/fdroid-build.yml'
      - 'android/**'
      - 'fdroid/**'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  release-apk:
    needs: compilers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Remove legacy development sideload key
        run: rm -f android/app/debug/lasso-dev.p12.b64

      - name: Check out shared ICK source producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: _/ai-ci-ick

      - name: Download qualified compiler stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ick-*
          path: _/build/ick-packages
          merge-multiple: true

      - name: Restore the qualified compiler stages
        run: |
          make -f _/ai-ci-ick/ick-android/Makefile restore-stage ABI=armeabi-v7a ICK_STAGE="$GITHUB_WORKSPACE/_/build/ick/armeabi-v7a" ICK_ARCHIVE="$GITHUB_WORKSPACE/_/build/ick-packages/ick-armeabi-v7a.tar.gz"
          make -f _/ai-ci-ick/ick-android/Makefile restore-stage ABI=arm64-v8a ICK_STAGE="$GITHUB_WORKSPACE/_/build/ick/arm64-v8a" ICK_ARCHIVE="$GITHUB_WORKSPACE/_/build/ick-packages/ick-arm64-v8a.tar.gz"
          make -f _/ai-ci-ick/ick-android/Makefile restore-stage ABI=x86_64 ICK_STAGE="$GITHUB_WORKSPACE/_/build/ick/x86_64" ICK_ARCHIVE="$GITHUB_WORKSPACE/_/build/ick-packages/ick-x86_64.tar.gz"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify declared source producers
        uses: isomorphisms/ai-ci@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        with:
          suite: _/ci/build-toolchain-suite.tsv
          root: .


      - name: Verify F-Droid release output
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/analytic-release-files.txt"
          grep -Fxq lib/arm64-v8a/libanalytic_continuation.so "$RUNNER_TEMP/analytic-release-files.txt"
          grep -Fxq lib/armeabi-v7a/libanalytic_continuation.so "$RUNNER_TEMP/analytic-release-files.txt"
          grep -Fxq lib/x86_64/libanalytic_continuation.so "$RUNNER_TEMP/analytic-release-files.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/analytic-release-badging.txt"
          grep -Fq "package: name='org.isomorphisms.analyticcontinuation' versionCode='3' versionName='0.2.1'" "$RUNNER_TEMP/analytic-release-badging.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: analytic-continuation-fdroid-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
