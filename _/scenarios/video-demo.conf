# Clean runtime animation used to prove that video behavior is selected by data,
# not injected by a capture script.
name=video-demo
presentation=clean
marker_radius=5.0
marker_stroke=1.8

# This reproduces the stronger wandering-off-screen-poles/lava-lamp family while
# keeping the mode explicit: it is holomorphic and nonzero on the visible region,
# but unlike exp(q) alone it is not entire on the whole plane.
field=wandering_offscreen_poles
field_speed=0.34
field_budget=6.0

motion=wander
seed=7319
wander_speed=0.075
wander_bound=1.75

zero=-0.82,0.28
zero=-0.18,-0.62
zero=0.48,0.52
zero=0.86,-0.18
pole=0.72,-0.46
pole=0.16,0.68
pole=-0.58,-0.34
pole=-0.92,0.06

# Only one pair is exchanging at a time. The second pair is deliberately
# nonadjacent in the starting layout.
exchange=zero,0,pole,2,3.0,5.0,ccw
exchange=zero,3,pole,1,10.0,5.0,cw
